name: Daily Stock Discovery

# Runs the discovery pipeline (YouTube + blog RSS -> ranked ideas -> Telegram)
# on GitHub's servers, where the Telegram Bot API is reachable (unlike a
# home ISP that blocks api.telegram.org). No VPN / VPS needed.

on:
  schedule:
    # GitHub cron is UTC. 03:00 UTC = 08:30 IST. Adjust to taste.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run discovery
        env:
          DISCOVERY_DRY_RUN: "False"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: set this secret only if you want YouTube to work despite
          # GitHub's datacenter IP being blocked by YouTube. Blank = direct.
          YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
          # Optional: set to use Claude synthesis instead of the free heuristic.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.discover

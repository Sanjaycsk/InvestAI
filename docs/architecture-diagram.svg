<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b1f3a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10294a"/>
      <stop offset="1" stop-color="#0a1c34"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19386a"/>
      <stop offset="1" stop-color="#142d55"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6677"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f6b"/>
    </marker>
    <style>
      .title{fill:#0b1f3a;font-size:30px;font-weight:800}
      .sub{fill:#5b6677;font-size:14.5px}
      .lbl{fill:#1a2230;font-size:14.5px;font-weight:700}
      .desc{fill:#5b6677;font-size:11.5px}
      .cap{fill:#8a94a6;font-size:11px;font-style:italic}
      .wlbl{fill:#ffffff;font-size:15px;font-weight:800;letter-spacing:.3px}
      .wsub{fill:#c6d4ea;font-size:11px}
      .wtxt{fill:#eef3fb;font-size:12px}
      .tag{fill:#8a94a6;font-size:10.5px;font-weight:700;letter-spacing:1.2px}
      .alink{fill:#5b6677;font-size:10.5px;font-weight:600}
      .alinkG{fill:#2f8f6b;font-size:10.5px;font-weight:600}
      .pillnum{fill:#e0b15a;font-size:13px;font-weight:800}
      .pilltx{fill:#eef3fb;font-size:11px;font-weight:600}
    </style>
  </defs>

  <rect width="1320" height="800" fill="#f6f8fb"/>

  <!-- Title -->
  <text x="40" y="50" class="title">InvestAI — System Architecture</text>
  <text x="40" y="76" class="sub">A self-grading equity research agent powered by Claude (Anthropic). Each layer lives where its data is actually reachable.</text>

  <!-- ===== Top ingest row (tops aligned at y=112) ===== -->
  <!-- A: YouTube channels -->
  <g filter="url(#sh)">
    <rect x="40" y="112" width="215" height="84" rx="12" fill="#ffffff" stroke="#d8deea"/>
    <rect x="40" y="112" width="6" height="84" rx="3" fill="#3a7bd5"/>
  </g>
  <text x="64" y="140" class="lbl">Trusted YouTube Channels</text>
  <text x="64" y="161" class="desc">gold · silver · market-direction</text>
  <text x="64" y="178" class="desc">analysts (Telugu / English)</text>

  <!-- B: Home fetcher -->
  <g filter="url(#sh)">
    <rect x="300" y="112" width="235" height="84" rx="12" fill="#ffffff" stroke="#d8deea"/>
    <rect x="300" y="112" width="6" height="84" rx="3" fill="#3a7bd5"/>
  </g>
  <text x="324" y="136" class="tag">RESIDENTIAL · HOME PC</text>
  <text x="324" y="158" class="lbl">Transcript Fetcher</text>
  <text x="324" y="178" class="desc">runs daily · wakes from sleep · pushes</text>

  <!-- C: GitHub (right edge aligns with the Claude box) -->
  <g filter="url(#sh)">
    <rect x="585" y="112" width="250" height="100" rx="12" fill="#ffffff" stroke="#d8deea"/>
    <rect x="585" y="112" width="6" height="100" rx="3" fill="#2c313a"/>
  </g>
  <text x="609" y="136" class="tag">PUBLIC · GITHUB</text>
  <text x="609" y="158" class="lbl">Data &amp; Code Repository</text>
  <text x="609" y="179" class="desc">• transcripts.json (data feed)</text>
  <text x="609" y="196" class="desc">• agent prompt (version-controlled)</text>

  <!-- arrows A -> B -> C -->
  <line x1="255" y1="154" x2="296" y2="154" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="535" y1="154" x2="581" y2="154" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- home-IP note, parked cleanly in the band below the A↔B junction -->
  <text x="278" y="228" class="cap" text-anchor="middle">YouTube loads only from a home IP</text>

  <!-- ===== Live Web ===== -->
  <g filter="url(#sh)">
    <rect x="40" y="350" width="225" height="112" rx="12" fill="#ffffff" stroke="#d8deea"/>
    <rect x="40" y="350" width="6" height="112" rx="3" fill="#2f8f6b"/>
  </g>
  <text x="64" y="378" class="lbl">Live Web</text>
  <text x="64" y="399" class="desc">news · prices · technicals</text>
  <text x="64" y="416" class="desc">fundamentals · valuation</text>
  <text x="64" y="433" class="desc">macro &amp; geopolitics</text>
  <text x="64" y="452" class="cap">(cloud reaches the web directly)</text>

  <!-- ===== Claude Agent (hero) ===== -->
  <g filter="url(#sh)">
    <rect x="360" y="262" width="475" height="272" rx="16" fill="url(#hero)"/>
  </g>
  <text x="384" y="296" class="wlbl">CLAUDE CLOUD AGENT · 3 RUNS/DAY</text>
  <text x="384" y="316" class="wsub">Anthropic · Claude Sonnet 4.6 · 08:30 · 10:00 · 15:00 IST · Mon–Fri · no API key</text>

  <!-- step pills -->
  <g>
    <rect x="384" y="336" width="102" height="80" rx="9" fill="url(#pill)" stroke="#21477e" stroke-width="1"/>
    <text x="396" y="358" class="pillnum">1</text>
    <text x="396" y="378" class="pilltx">Review &amp;</text>
    <text x="396" y="393" class="pilltx">grade</text>
    <text x="396" y="408" class="pilltx">yesterday</text>
  </g>
  <g>
    <rect x="494" y="336" width="102" height="80" rx="9" fill="url(#pill)" stroke="#21477e" stroke-width="1"/>
    <text x="506" y="358" class="pillnum">1.5</text>
    <text x="506" y="378" class="pilltx">Learn from</text>
    <text x="506" y="393" class="pilltx">past</text>
    <text x="506" y="408" class="pilltx">reviews</text>
  </g>
  <g>
    <rect x="604" y="336" width="102" height="80" rx="9" fill="url(#pill)" stroke="#21477e" stroke-width="1"/>
    <text x="616" y="358" class="pillnum">2</text>
    <text x="616" y="378" class="pilltx">Analyze 24</text>
    <text x="616" y="393" class="pilltx">6 factors,</text>
    <text x="616" y="408" class="pilltx">weighted</text>
  </g>
  <g>
    <rect x="714" y="336" width="102" height="80" rx="9" fill="url(#pill)" stroke="#21477e" stroke-width="1"/>
    <text x="726" y="358" class="pillnum">3</text>
    <text x="726" y="378" class="pilltx">Decide &amp;</text>
    <text x="726" y="393" class="pilltx">log to</text>
    <text x="726" y="408" class="pilltx">memory</text>
  </g>

  <text x="384" y="442" class="wtxt">6-factor weighted score → Strong&#160;Buy / Buy / Watchlist / Hold / Avoid·Sell</text>
  <text x="384" y="462" class="wtxt">→ a BUY / HOLD / SELL verdict per instrument. Risk can veto any call.</text>
  <text x="384" y="492" class="wsub">It reasons like an analyst and explains every factor — not a fixed if/else script.</text>
  <text x="384" y="512" class="wsub">Verdict FROZEN at Run 1 · later runs annotate &amp; de-risk · coffee debate each run.</text>

  <!-- GitHub -> Claude (reads transcripts + prompt) -->
  <path d="M710,212 C710,240 666,236 660,260" fill="none" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="718" y="238" class="alink">reads data + prompt</text>

  <!-- Web -> Claude -->
  <line x1="265" y1="400" x2="356" y2="400" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="392" class="cap">researches</text>

  <!-- ===== Notion ===== -->
  <g filter="url(#sh)">
    <rect x="905" y="300" width="350" height="212" rx="14" fill="#ffffff" stroke="#d8deea"/>
    <rect x="905" y="300" width="6" height="212" rx="3" fill="#2f8f6b"/>
  </g>
  <text x="930" y="328" class="tag">WORKSPACE · NOTION</text>
  <text x="930" y="350" class="lbl">Audit Memory (the track record)</text>
  <text x="930" y="374" class="desc">• Recommendations — every call, the</text>
  <text x="930" y="389" class="desc">&#160;&#160;reasoning per factor + intraday notes</text>
  <text x="930" y="410" class="desc">• Daily Review — accuracy, self-rating,</text>
  <text x="930" y="425" class="desc">&#160;&#160;mistakes, lessons, mgmt-alpha</text>
  <text x="930" y="446" class="desc">• Coffee Shop — 6-persona debate / run</text>
  <text x="930" y="470" class="cap">timestamped &amp; human-readable</text>

  <!-- Claude <-> Notion : two stacked arrows in the gap, labels centered -->
  <line x1="835" y1="350" x2="905" y2="350" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="342" class="alink" text-anchor="middle">writes verdicts</text>
  <line x1="905" y1="414" x2="835" y2="414" stroke="#2f8f6b" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="870" y="406" class="alinkG" text-anchor="middle">reads &amp; grades</text>

  <!-- ===== Human ===== -->
  <g filter="url(#sh)">
    <rect x="905" y="565" width="350" height="88" rx="14" fill="#ffffff" stroke="#d8deea"/>
    <rect x="905" y="565" width="6" height="88" rx="3" fill="#c79a3b"/>
  </g>
  <text x="930" y="597" class="lbl">You — review &amp; decide</text>
  <text x="930" y="619" class="desc">The agent only suggests. A human acts on it.</text>
  <text x="930" y="637" class="desc">It never trades — blast radius of any call is zero.</text>

  <!-- Notion -> Human -->
  <line x1="1080" y1="512" x2="1080" y2="561" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="529" class="alink">daily brief</text>

  <!-- ===== Mobile Dashboard ===== -->
  <g filter="url(#sh)">
    <rect x="470" y="560" width="345" height="116" rx="14" fill="#ffffff" stroke="#d8deea"/>
    <rect x="470" y="560" width="6" height="116" rx="3" fill="#6c4cd1"/>
  </g>
  <text x="494" y="586" class="tag">PHONE / WEB · PWA</text>
  <text x="494" y="606" class="lbl">Mobile Dashboard</text>
  <text x="494" y="626" class="desc">Buy / Sell / Hold (expandable) · through-the-day ·</text>
  <text x="494" y="642" class="desc">de-risk · market mood · Gold &amp; Silver · backtest ·</text>
  <text x="494" y="658" class="desc">Coffee Shop debate · accuracy · passcode-gated</text>

  <!-- Notion -> Dashboard (reads live) -->
  <path d="M905,505 C862,528 870,582 820,590" fill="none" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="852" y="544" class="alink" text-anchor="middle">reads live</text>

  <!-- ===== Legend ===== -->
  <text x="40" y="600" class="tag">DATA FLOW</text>
  <line x1="40" y1="618" x2="80" y2="618" stroke="#5b6677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="622" class="desc">information / control flow</text>
  <line x1="40" y1="642" x2="80" y2="642" stroke="#2f8f6b" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="90" y="646" class="desc">feedback / learning loop</text>

  <text x="40" y="692" class="tag">ENVIRONMENTS</text>
  <rect x="40" y="702" width="14" height="14" rx="3" fill="#3a7bd5"/><text x="60" y="714" class="desc">Home (residential)</text>
  <rect x="210" y="702" width="14" height="14" rx="3" fill="#2c313a"/><text x="230" y="714" class="desc">Public GitHub</text>
  <rect x="350" y="702" width="14" height="14" rx="3" fill="#0b1f3a"/><text x="370" y="714" class="desc">Anthropic Cloud</text>
  <rect x="520" y="702" width="14" height="14" rx="3" fill="#2f8f6b"/><text x="540" y="714" class="desc">Notion / Web</text>
  <rect x="660" y="702" width="14" height="14" rx="3" fill="#c79a3b"/><text x="680" y="714" class="desc">Human</text>
  <rect x="770" y="702" width="14" height="14" rx="3" fill="#6c4cd1"/><text x="790" y="714" class="desc">Dashboard (app)</text>

  <text x="40" y="754" class="cap">Research &amp; education only · not financial advice · 3 runs/day (08:30 · 10:00 · 15:00 IST) · Claude Sonnet 4.6</text>
</svg>
